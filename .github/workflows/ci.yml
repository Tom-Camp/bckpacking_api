name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/prek
          key: prek-${{ hashFiles('.pre-commit-config.yaml', 'uv.lock') }}
      # Same hooks and prek version (from uv.lock) as local commits: the pre-commit-hooks checks,
      # ruff (incl. its S security rules), ruff-format and mypy. commitizen only runs at
      # the commit-msg stage, so it's not included here.
      - run: uv run prek run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bp
          POSTGRES_PASSWORD: bp
          POSTGRES_DB: bp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bp -d bp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # app.utils.config.Settings requires these at import time
      JWT_SECRET: ci-only-not-a-secret
      POSTGRES_USER: bp
      POSTGRES_PASSWORD: bp
      POSTGRES_DB: bp
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: "3.14"
      - run: uv sync --locked

      # Migrations: build the schema from scratch the way production does,
      # then confirm the models have no changes the migration is missing.
      - name: Migrate empty database
        run: uv run alembic upgrade head
      - name: Check models match migrations
        run: uv run alembic check

      - name: Create test database
        run: psql -h localhost -U bp -d bp -c "CREATE DATABASE bp_test"
        env:
          PGPASSWORD: bp
      - name: Run tests against Postgres
        run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://bp:bp@localhost:5432/bp_test
