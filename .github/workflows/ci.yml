name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ hashFiles('.pre-commit-config.yaml', 'uv.lock') }}
      # Same hooks and prek version (from uv.lock) as local commits: the pre-commit-hooks checks,
      # ruff (incl. its S security rules), ruff-format and mypy. commitizen only runs at
      # the commit-msg stage, so it's not included here.
      - run: uv run prek run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bp
          POSTGRES_PASSWORD: bp
          POSTGRES_DB: bp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bp -d bp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # app.utils.config.Settings requires these at import time
      JWT_SECRET: ci-only-not-a-secret
      POSTGRES_USER: bp
      POSTGRES_PASSWORD: bp
      POSTGRES_DB: bp
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
      - run: uv sync --locked

      # Migrations: build the schema from scratch the way production does,
      # then confirm the models have no changes the migration is missing.
      - name: Migrate empty database
        run: uv run alembic upgrade head
      - name: Check models match migrations
        run: uv run alembic check

      - name: Create test database
        run: psql -h localhost -U bp -d bp -c "CREATE DATABASE bp_test"
        env:
          PGPASSWORD: bp
      - name: Run tests against Postgres
        run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://bp:bp@localhost:5432/bp_test
